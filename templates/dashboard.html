<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        .metric-label {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .status {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .refresh-btn {
            background: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .controls {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 System Monitoring Dashboard</h1>
            <p>Real-time system metrics</p>
        </header>

        <div class="controls">
            <button class="refresh-btn" onclick="fetchMetrics()">🔄 Refresh</button>
            <span id="last-update" style="color: white; font-size: 0.85em;">Loading...</span>
        </div>

        <div class="metrics-grid">
            <!-- CPU -->
            <div class="metric-card">
                <h3>💻 CPU Usage</h3>
                <div class="metric-value" id="cpu-percent">--</div>
                <div class="metric-label">CPU Utilization</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="cpu-progress" style="width: 0%"></div>
                </div>
                <div style="font-size: 0.85em; color: #666; margin-top: 10px;">
                    Cores: <span id="cpu-cores">--</span>
                </div>
            </div>

            <!-- Memory -->
            <div class="metric-card">
                <h3>💾 Memory Usage</h3>
                <div class="metric-value" id="mem-percent">--</div>
                <div class="metric-label">Memory Utilization</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="mem-progress" style="width: 0%"></div>
                </div>
                <div style="font-size: 0.85em; color: #666; margin-top: 10px;">
                    <span id="mem-used">--</span> / <span id="mem-total">--</span> GB
                </div>
            </div>

            <!-- Disk -->
            <div class="metric-card">
                <h3>💿 Disk Usage</h3>
                <div class="metric-value" id="disk-percent">--</div>
                <div class="metric-label">Disk Utilization</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="disk-progress" style="width: 0%"></div>
                </div>
                <div style="font-size: 0.85em; color: #666; margin-top: 10px;">
                    <span id="disk-used">--</span> / <span id="disk-total">--</span> GB
                </div>
            </div>
        </div>

        <div class="status" id="status">✅ Dashboard loaded</div>
    </div>

    <script>
        async function fetchMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();

                const time = new Date(data.timestamp).toLocaleTimeString();
                
                // CPU
                document.getElementById('cpu-percent').textContent = data.cpu.percent.toFixed(1) + '%';
                document.getElementById('cpu-cores').textContent = data.cpu.count;
                document.getElementById('cpu-progress').style.width = data.cpu.percent + '%';

                // Memory
                document.getElementById('mem-percent').textContent = data.memory.percent.toFixed(1) + '%';
                document.getElementById('mem-used').textContent = data.memory.used_gb;
                document.getElementById('mem-total').textContent = data.memory.total_gb;
                document.getElementById('mem-progress').style.width = data.memory.percent + '%';

                // Disk
                document.getElementById('disk-percent').textContent = data.disk.percent.toFixed(1) + '%';
                document.getElementById('disk-used').textContent = data.disk.used_gb;
                document.getElementById('disk-total').textContent = data.disk.total_gb;
                document.getElementById('disk-progress').style.width = data.disk.percent + '%';

                document.getElementById('last-update').textContent = 'Last updated: ' + time;
                document.getElementById('status').textContent = '✅ Updated';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = '❌ Error fetching metrics';
            }
        }

        // Fetch on load and every 5 seconds
        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
